<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento - Hospital VidaNova</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8fb;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.12);
        }

        h2 {
            color: #00897b;
            margin-bottom: 25px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-cadastrar {
            width: 100%;
            background: #00897b;
            color: white;
            margin-top: 15px;
        }

        .btn-cadastrar:hover {
            background: #00695c;
        }

        .btn-voltar {
            background: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .btn-voltar:hover {
            background: #545b62;
        }

        #mensagem {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .sucesso {
            display: block !important;
            background: #d4edda;
            color: #155724;
        }

        .erro {
            display: block !important;
            background: #f8d7da;
            color: #721c24;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>
        🏥 Cadastro de Paciente
    </h2>

    <input
        id="nome"
        type="text"
        placeholder="Nome do paciente"
    >

    <input
        id="cpf"
        type="text"
        placeholder="CPF"
    >

    <select id="tipo">

        <option value="Convenio">
            Convênio
        </option>

        <option value="Particular">
            Particular
        </option>

    </select>

    <input
        id="foto"
        type="file"
        accept="image/*"
    >

    <button
        class="btn-cadastrar"
        type="button"
        onclick="cadastrar()">

        Cadastrar Paciente

    </button>

    <button
        class="btn-voltar"
        type="button"
        onclick="voltarTriagem()">

        ← Voltar para Triagem

    </button>

    <div id="mensagem"></div>

</div>


<script>

async function cadastrar() {

    const nome =
        document
        .getElementById("nome")
        .value
        .trim();

    const cpf =
        document
        .getElementById("cpf")
        .value
        .trim();

    const tipo =
        document
        .getElementById("tipo")
        .value;


    if (nome === "") {

        mostrarMensagem(
            "Digite o nome do paciente.",
            "erro"
        );

        return;

    }


    if (cpf === "") {

        mostrarMensagem(
            "Digite o CPF do paciente.",
            "erro"
        );

        return;

    }


    /*
     * Recupera pacientes existentes.
     */

    let pacientes =
        JSON.parse(
            localStorage.getItem("pacientes")
        ) || [];


    /*
     * Verifica se o CPF já existe.
     */

    const cpfExiste =
        pacientes.some(
            function(paciente) {

                return paciente.cpf === cpf;

            }
        );


    if (cpfExiste) {

        mostrarMensagem(
            "Já existe um paciente cadastrado com este CPF.",
            "erro"
        );

        return;

    }


    /*
     * Cria o paciente.
     */

    const paciente = {

        id: Date.now(),

        nome: nome,

        cpf: cpf,

        tipo: tipo,

        status: "triagem",

        sintoma: "",

        temperatura: "",

        alergia: "",

        observacao: "",

        risco: ""

    };


    /*
     * Adiciona à lista.
     */

    pacientes.push(
        paciente
    );


    /*
     * Salva no navegador.
     */

    localStorage.setItem(
        "pacientes",
        JSON.stringify(pacientes)
    );


    /*
     * ENVIA PARA O BACKEND
     */

    try {

        const resposta = await fetch(
            "http://localhost:3000/atendimento",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    nome: nome,

                    documento: cpf,

                    dataNascimento: "",

                    sexo: "",

                    nomeMae: "",

                    estadoCivil: "",

                    endereco: "",

                    telefone: "",

                    email: "",

                    contatoEmergencia: "",

                    tipo: tipo

                })

            }
        );


        if (!resposta.ok) {

            throw new Error(
                "Erro ao enviar paciente para o backend."
            );

        }


        /*
         * Limpa formulário.
         */

        document.getElementById(
            "nome"
        ).value = "";


        document.getElementById(
            "cpf"
        ).value = "";


        document.getElementById(
            "tipo"
        ).value = "Convenio";


        document.getElementById(
            "foto"
        ).value = "";


        mostrarMensagem(
            "✅ Paciente cadastrado com sucesso! Ele já está disponível na triagem.",
            "sucesso"
        );


    } catch (erro) {

        console.error(erro);

        mostrarMensagem(
            "⚠️ Paciente salvo, mas não foi possível enviar para o backend.",
            "erro"
        );

    }

}


function mostrarMensagem(
    texto,
    tipo
) {

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.textContent =
        texto;


    mensagem.className =
        tipo;

}


function voltarTriagem() {

    window.location.href =
        "triagem.html";

}

</script>

</body>

</html>
