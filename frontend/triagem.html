
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Oliveira | Triagem</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #eef6f8;
  color: #30444b;
  padding: 25px 15px;
}

.container {
  max-width: 850px;
  margin: auto;
}

header, .painel {
  background: white;
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 8px 25px #0000000d;
}

header {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.logo {
  width: 55px;
  height: 55px;
  background: #55afce;
  color: white;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 30px;
}

h1 {
  color: #287b98;
  font-size: 23px;
}

header p, .subtitulo {
  color: #7b8d94;
  margin-top: 6px;
  font-size: 13px;
}

h2 {
  color: #287b98;
  font-size: 19px;
  margin-bottom: 18px;
}

.grupo {
  margin-bottom: 16px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 7px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccd9dd;
  border-radius: 9px;
  background: #f8fbfc;
  color: #30444b;
  font: inherit;
}

textarea {
  resize: vertical;
  min-height: 90px;
}

button {
  width: 100%;
  border: none;
  padding: 14px;
  margin-top: 9px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

button:hover {
  filter: brightness(.97);
}

.btn-ia {
  background: #287b98;
  color: white;
}

.btn-salvar {
  background: #55b98b;
  color: white;
}

.resultado {
  display: none;
  margin-top: 20px;
  padding: 18px;
  border-radius: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.resultado h3 {
  margin-bottom: 10px;
}

.resultado ul {
  padding-left: 22px;
  margin: 10px 0;
}

.vermelho {
  display: block;
  background: #fff0f1;
  border: 1px solid #df7078;
}

.amarelo {
  display: block;
  background: #fff5df;
  border: 1px solid #e9aa4c;
}

.verde {
  display: block;
  background: #e6f7ef;
  border: 1px solid #55b98b;
}

.aviso {
  margin-top: 14px;
  font-size: 12px;
  color: #596d75;
}

footer {
  text-align: center;
  color: #7b8d94;
  font-size: 12px;
  padding: 10px;
}

@media (max-width: 500px) {
  header, .painel {
    padding: 18px;
  }

  h1 {
    font-size: 20px;
  }
}
</style>
</head>

<body>
<div class="container">

  <header>
    <div class="logo">✚</div>
    <div>
      <h1>HOSPITAL OLIVEIRA</h1>
      <p>Sistema hospitalar • Triagem e análise de riscos</p>
    </div>
  </header>

  <section class="painel">
    <h2>🩺 Formulário de triagem</h2>
    <p class="subtitulo">
      Preencha os dados do paciente para realizar a análise inicial.
    </p>

    <form id="formTriagem">
      <div class="grupo">
        <label for="nome">Nome do paciente</label>
        <input id="nome" type="text"
          placeholder="Digite o nome completo" required>
      </div>

      <div class="grupo">
        <label for="sintoma">Principal sintoma</label>
        <select id="sintoma" required>
          <option value="">Selecione o sintoma</option>
          <option value="dor_leve">Dor leve</option>
          <option value="resfriado">Resfriado</option>
          <option value="coriza">Coriza</option>
          <option value="tosse">Tosse</option>
          <option value="febre">Febre</option>
          <option value="vomito">Vômito</option>
          <option value="diarreia">Diarreia</option>
          <option value="falta_ar_moderada">Falta de ar moderada</option>
          <option value="falta_ar_grave">Falta de ar grave</option>
          <option value="infarto">Suspeita de infarto</option>
          <option value="avc">Suspeita de AVC</option>
          <option value="convulsao">Convulsão</option>
          <option value="hemorragia">Hemorragia</option>
        </select>
      </div>

      <div class="grupo">
        <label for="temp">Temperatura corporal (°C)</label>
        <input id="temp" type="number" step="0.1"
          min="25" max="45" placeholder="Ex.: 37.5">
      </div>

      <div class="grupo">
        <label for="alergia">Alergias conhecidas</label>
        <input id="alergia" type="text"
          placeholder="Informe as alergias ou escreva 'Não informado'">
      </div>

      <div class="grupo">
        <label for="observacao">Outros sintomas e observações</label>
        <textarea id="observacao"
          placeholder="Descreva os sintomas, quando começaram e outras informações importantes"></textarea>
      </div>

      <button type="button" class="btn-ia"
        onclick="analisarRiscos()">
        ✦ Analisar riscos com IA
      </button>

      <div id="resultado" class="resultado" aria-live="polite"></div>

      <button type="submit" class="btn-salvar">
        ✓ Salvar triagem
      </button>
    </form>
  </section>

  <footer>
    Sistema Hospitalar Oliveira • Protótipo de triagem
  </footer>
</div>

<script>
/*
  IMPORTANTE:
  Esta é uma análise automática baseada em regras.
  Não é uma IA médica real e não substitui a avaliação
  de um profissional de saúde.
*/

function analisarRiscos() {
  const sintoma = document.getElementById("sintoma").value;
  const tempTexto = document.getElementById("temp").value;
  const temperatura = tempTexto === "" ? null : Number(tempTexto);
  const alergia = document.getElementById("alergia").value.trim();
  const observacao = document.getElementById("observacao").value.trim();

  const resultado = document.getElementById("resultado");
  const texto = observacao.toLocaleLowerCase("pt-BR");

  const riscos = [];
  let nivel = "verde";

  const sinaisGraves = [
    {
      termos: ["dor no peito", "aperto no peito", "dor no peito forte"],
      risco: "Dor no peito: pode exigir avaliação urgente."
    },
    {
      termos: ["boca torta", "fala enrolada", "fraqueza de um lado",
        "rosto torto", "perda súbita de força"],
      risco: "Possíveis sinais de AVC: emergência médica."
    },
    {
      termos: ["não consigo respirar", "sem conseguir respirar",
        "falta de ar intensa", "dificuldade grave para respirar"],
      risco: "Dificuldade respiratória intensa: emergência médica."
    },
    {
      termos: ["sangramento intenso", "sangrando muito",
        "hemorragia", "perda intensa de sangue"],
      risco: "Possível sangramento grave: requer atendimento urgente."
    },
    {
      termos: ["desmaiou", "perdeu a consciência",
        "inconsciente", "convulsão"],
      risco: "Alteração da consciência ou convulsão: requer avaliação urgente."
    },
    {
      termos: ["confusão mental súbita", "confuso de repente"],
      risco: "Confusão mental súbita: pode indicar uma emergência."
    }
  ];

  const sintomasGraves = [
    "infarto", "avc", "convulsao", "hemorragia", "falta_ar_grave"
  ];

  const sintomasModerados = [
    "febre", "vomito", "diarreia", "falta_ar_moderada"
  ];

  if (!sintoma) {
    alert("Selecione o principal sintoma antes de analisar.");
    return;
  }

  // Sinais de alerta informados no campo de observações
  sinaisGraves.forEach(item => {
    if (item.termos.some(termo => texto.includes(termo))) {
      riscos.push(item.risco);
    }
  });

  // Classificação inicial pelo sintoma selecionado
  if (sintomasGraves.includes(sintoma)) {
    riscos.push("O sintoma selecionado está marcado como sinal de alto risco.");
  } else if (sintomasModerados.includes(sintoma)) {
    riscos.push("O sintoma selecionado pode precisar de avaliação clínica prioritária.");
  }

  // Temperatura
  if (temperatura !== null && Number.isFinite(temperatura)) {
    if (temperatura >= 39) {
      riscos.push("Temperatura elevada (39 °C ou mais): precisa de avaliação clínica.");
    } else if (temperatura >= 38) {
      riscos.push("Temperatura compatível com febre.");
    } else if (temperatura < 35) {
      riscos.push("Temperatura abaixo de 35 °C: necessita de avaliação imediata.");
    }
  }

  // Alergias
  if (alergia && !/^(não|nao)\s*(informado|informada|sei)?$/i.test(alergia)) {
    riscos.push("Alergia informada: confirmar com a equipe antes de administrar medicamentos.");
  }

  // Informações adicionais
  if (!observacao) {
    riscos.push("Não foram preenchidas observações adicionais. Pergunte sobre outros sintomas.");
  }

  if (sintoma === "falta_ar_grave" ||
      sintoma === "infarto" ||
      sintoma === "avc" ||
      sintoma === "convulsao" ||
      sintoma === "hemorragia" ||
      (temperatura !== null && temperatura >= 39) ||
      (temperatura !== null && temperatura < 35) ||
      sinaisGraves.some(item => item.termos.some(termo => texto.includes(termo)))) {
    nivel = "vermelho";
  } else if (
    sintomasModerados.includes(sintoma) ||
    sintoma === "falta_ar_moderada" ||
    (temperatura !== null && temperatura >= 38)
  ) {
    nivel = "amarelo";
  }

  const titulos = {
    vermelho: "🔴 ALERTA DE ALTO RISCO",
    amarelo: "🟡 ATENÇÃO — AVALIAÇÃO PRIORITÁRIA",
    verde: "🟢 SEM ALERTA GRAVE IDENTIFICADO PELAS REGRAS"
  };

  const lista = riscos.length
    ? "<ul>" + riscos.map(r =>
        "<li>" + escaparHTML(r) + "</li>"
      ).join("") + "</ul>"
    : "<p>As regras não identificaram alertas específicos nos dados informados. Isso não garante que o paciente esteja sem riscos.</p>";

  resultado.className = "resultado " + nivel;
  resultado.innerHTML = `
    <h3>${titulos[nivel]}</h3>
    <p><strong>Paciente:</strong> ${escaparHTML(
      document.getElementById("nome").value.trim() || "Não informado"
    )}</p>
    <p><strong>Possíveis riscos e pontos de atenção:</strong></p>
    ${lista}
    <p class="aviso">
      Esta análise é automática e limitada aos dados informados.
      Não diagnostica doenças, não prevê todos os riscos e não substitui
      a classificação oficial feita por um profissional de saúde.
      Em sinais de emergência, procure atendimento imediatamente.
    </p>
  `;

  resultado.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function escaparHTML(valor) {
  return String(valor).replace(/[&<>"']/g, caractere => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[caractere]);
}

// Salva a triagem no servidor do sistema.
document.getElementById("formTriagem").addEventListener("submit", async event => {
  event.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const sintoma = document.getElementById("sintoma").value;
  const tempTexto = document.getElementById("temp").value;
  const temperatura = tempTexto === "" ? null : Number(tempTexto);
  const alergia = document.getElementById("alergia").value.trim();
  const observacao = document.getElementById("observacao").value.trim();

  if (!nome || !sintoma) {
    alert("Preencha o nome e selecione o principal sintoma.");
    return;
  }

  let risco = "verde";

  if ([
    "infarto", "avc", "convulsao", "hemorragia", "falta_ar_grave"
  ].includes(sintoma) || (temperatura !== null && (temperatura >= 39 || temperatura < 35))) {
    risco = "vermelho";
  } else if ([
    "febre", "vomito", "diarreia", "falta_ar_moderada"
  ].includes(sintoma) || (temperatura !== null && temperatura >= 38)) {
    risco = "amarelo";
  }

  try {
    const resposta = await fetch("/triagem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nome, sintoma, temperatura, alergia, observacao, risco
      })
    });

    if (!resposta.ok) {
      throw new Error("Não foi possível salvar a triagem.");
    }

    alert("Triagem salva com sucesso!");
  } catch (erro) {
    console.error(erro);
    alert("Não foi possível salvar. Verifique se o servidor está funcionando.");
  }
});
</script>
</body>
</html>
